<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Libra.</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                    radial-gradient(circle at 15% 20%, rgba(70, 90, 255, 0.18), transparent 30%),
                    radial-gradient(circle at 85% 80%, rgba(130, 70, 255, 0.14), transparent 30%),
                    #07080d;
            color: #ffffff;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .glow {
            position: fixed;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: rgba(77, 95, 255, 0.12);
            filter: blur(100px);
            pointer-events: none;
        }

        .glow.one {
            top: -150px;
            left: -100px;
        }

        .glow.two {
            bottom: -150px;
            right: -100px;
        }

        .login-card {
            position: relative;
            z-index: 2;

            width: min(460px, 92%);
            padding: 50px;

            background: rgba(18, 19, 28, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 25px;

            box-shadow:
                    0 30px 100px rgba(0, 0, 0, 0.55),
                    inset 0 1px rgba(255, 255, 255, 0.05);

            backdrop-filter: blur(20px);

            animation: appear 0.6s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 35px;
        }

        .logo span {
            color: #6575ff;
        }

        .admin-badge {
            width: fit-content;
            margin: 0 auto 18px;

            padding: 7px 13px;

            border-radius: 20px;

            background: rgba(101, 117, 255, 0.12);
            border: 1px solid rgba(101, 117, 255, 0.2);

            color: #8290ff;

            font-size: 11px;
            font-weight: 700;

            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .header p {
            color: #8f93a5;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 9px;

            font-size: 13px;
            font-weight: 600;

            color: #c5c8d5;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            height: 52px;

            padding: 0 17px;

            border-radius: 13px;
            border: 1px solid #292c3a;

            outline: none;

            background: #101119;
            color: white;

            font-size: 14px;

            transition: 0.25s;
        }

        .input-wrapper input:focus {
            border-color: #6373ff;

            box-shadow:
                    0 0 0 3px rgba(99, 115, 255, 0.12);
        }

        .input-wrapper input::placeholder {
            color: #5f6373;
        }

        .login-btn {
            width: 100%;
            height: 53px;

            margin-top: 10px;

            border: none;
            border-radius: 13px;

            background: linear-gradient(
                    135deg,
                    #6575ff,
                    #5364ed
            );

            color: white;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            box-shadow:
                    0 10px 25px rgba(83, 100, 237, 0.25);

            transition: 0.25s;
        }

        .login-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                    0 15px 30px rgba(83, 100, 237, 0.35);
        }

        .login-btn.loading {
            opacity: 0.7;
            pointer-events: none;
        }

        .error-message {
            display: none;

            margin-top: 15px;
            padding: 12px 14px;

            border-radius: 10px;

            background: rgba(255, 70, 70, 0.08);
            border: 1px solid rgba(255, 70, 70, 0.18);

            color: #ff8585;

            font-size: 13px;
            line-height: 1.5;
        }

        .error-message.show {
            display: block;
        }

        .back-home {
            display: block;

            margin-top: 22px;

            text-align: center;

            color: #626677;
            text-decoration: none;

            font-size: 12px;

            transition: 0.2s;
        }

        .back-home:hover {
            color: #9ba4ff;
        }

        @media (max-width: 500px) {
            .login-card {
                padding: 35px 25px;
            }

            .header h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<div class="glow one"></div>
<div class="glow two"></div>

<div class="login-card">

    <div class="logo">
        Libra<span>.</span>
    </div>

    <div class="admin-badge">
        Administrator Access
    </div>

    <div class="header">
        <h1>Admin Login</h1>

        <p>
            Sign in to manage your library.
        </p>
    </div>

    <form id="adminLoginForm">

        <div class="input-group">

            <label for="adminEmail">
                Email address
            </label>

            <div class="input-wrapper">

                <input
                        type="email"
                        id="adminEmail"
                        placeholder="admin@libra.com"
                        required
                >

            </div>

        </div>


        <div class="input-group">

            <label for="adminPassword">
                Password
            </label>

            <div class="input-wrapper">

                <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter admin password"
                        required
                >

            </div>

        </div>


        <button
                type="submit"
                class="login-btn"
                id="adminLoginButton"
        >
            Sign in as Admin
        </button>


        <div
                class="error-message"
                id="adminError"
        ></div>

    </form>


    <a href="/login.html" class="back-home">
        ← Back to User Login
    </a>

</div>


<script>


    const adminLoginForm =
        document.getElementById("adminLoginForm");

    const adminEmail =
        document.getElementById("adminEmail");

    const adminPassword =
        document.getElementById("adminPassword");

    const adminLoginButton =
        document.getElementById("adminLoginButton");

    const adminError =
        document.getElementById("adminError");


    adminLoginForm.addEventListener("submit", async (event) => {

        event.preventDefault();

        adminError.classList.remove("show");
        adminError.textContent = "";

        const email = adminEmail.value.trim();
        const password = adminPassword.value;


        adminLoginButton.classList.add("loading");
        adminLoginButton.textContent = "Signing in...";


        try {

            const response = await fetch(
                `/user/admin-login?email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`,
                {
                    method: "POST"
                }
            );


            const data = await response.json();


            if (!response.ok) {
                throw new Error(
                    data.message || "Invalid admin credentials"
                );
            }


            // Make sure the account is actually an admin
            if (data.role !== "ADMIN") {
                throw new Error(
                    "This account does not have admin access."
                );
            }


            // Save admin session
            localStorage.setItem(
                "adminUser",
                JSON.stringify({
                    id: data.id,
                    name: data.name,
                    email: data.email,
                    role: data.role
                })
            );


            adminLoginButton.textContent =
                "Login successful ✓";


            setTimeout(() => {

                window.location.href = "/admin.html";

            }, 500);


        } catch (error) {

            console.error("Admin login error:", error);

            adminError.textContent =
                error.message ||
                "Something went wrong. Please try again.";

            adminError.classList.add("show");

            adminLoginButton.classList.remove("loading");

            adminLoginButton.textContent =
                "Sign in as Admin";

        }

    });

</script>

</body>
</html>
