<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Orders | Libra.</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

            background:
                    radial-gradient(
                            circle at 10% 10%,
                            rgba(70, 90, 255, 0.16),
                            transparent 30%
                    ),
                    radial-gradient(
                            circle at 90% 80%,
                            rgba(170, 70, 255, 0.13),
                            transparent 30%
                    ),
                    #07080d;

            color: white;
            min-height: 100vh;
        }


        /* NAVBAR */

        nav {
            height: 82px;
            padding: 0 6%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom: 1px solid rgba(255,255,255,0.08);

            backdrop-filter: blur(15px);
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .logo span {
            color: #778cff;
        }

        .nav-links {
            display: flex;
            gap: 34px;
        }

        .nav-links a {
            color: #b9b9c8;
            text-decoration: none;
            font-size: 15px;
            transition: 0.25s;
        }

        .nav-links a:hover {
            color: white;
        }

        .cart-nav {
            padding: 11px 18px;
            border-radius: 12px;

            background:
                    linear-gradient(
                            135deg,
                            #718cff,
                            #9b65ff
                    );

            color: white;
            text-decoration: none;
            font-weight: 700;

            box-shadow:
                    0 8px 25px
                    rgba(105,110,255,0.25);
        }


        /* PAGE */

        .page {
            width: 88%;
            max-width: 1100px;

            margin: 55px auto 80px;
        }

        .eyebrow {
            color: #8d8cff;
            font-size: 13px;
            font-weight: 700;

            letter-spacing: 2px;
            text-transform: uppercase;

            margin-bottom: 12px;
        }

        h1 {
            font-size: clamp(38px, 5vw, 58px);
            letter-spacing: -2px;
        }

        .subtitle {
            color: #8e8e9c;
            margin-top: 10px;
            font-size: 16px;
        }


        /* LOADING */

        .loading {
            text-align: center;
            padding: 100px 20px;

            color: #858594;
        }


        /* EMPTY */

        .empty {
            text-align: center;

            padding: 90px 20px;

            margin-top: 40px;

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 25px;

            background:
                    rgba(255,255,255,0.035);
        }

        .empty-icon {
            font-size: 55px;
            margin-bottom: 20px;
        }

        .empty h2 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .empty p {
            color: #8e8e9d;
            margin-bottom: 25px;
        }

        .browse-btn {
            display: inline-block;

            padding: 13px 22px;

            border-radius: 12px;

            background:
                    linear-gradient(
                            135deg,
                            #718cff,
                            #9c62ff
                    );

            color: white;
            text-decoration: none;

            font-weight: 700;
        }


        /* ORDERS */

        .orders {
            display: flex;
            flex-direction: column;

            gap: 18px;

            margin-top: 40px;
        }

        .order-card {

            padding: 25px;

            border-radius: 22px;

            background:
                    linear-gradient(
                            145deg,
                            rgba(255,255,255,0.08),
                            rgba(255,255,255,0.035)
                    );

            border: 1px solid
            rgba(255,255,255,0.09);

            backdrop-filter: blur(20px);

            transition: 0.25s;
        }

        .order-card:hover {
            border-color:
                    rgba(130,120,255,0.35);

            transform:
                    translateY(-2px);
        }


        .order-top {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;
        }

        .order-number {
            font-size: 18px;
            font-weight: 700;
        }

        .order-date {
            color: #858b9e;
            font-size: 13px;
            margin-top: 6px;
        }


        /* STATUS */

        .status {

            padding: 7px 13px;

            border-radius: 20px;

            background:
                    rgba(126,224,164,0.1);

            border:
                    1px solid
                    rgba(126,224,164,0.2);

            color: #7ee0a4;

            font-size: 12px;

            font-weight: 700;

            text-transform: uppercase;
        }


        .order-details {

            display: grid;

            grid-template-columns:
                1fr 1fr 1fr;

            gap: 20px;

            padding-top: 20px;

            border-top:
                    1px solid
                    rgba(255,255,255,0.08);
        }


        .detail-label {

            color: #858b9e;

            font-size: 12px;

            margin-bottom: 7px;
        }

        .detail-value {

            color: white;

            font-size: 15px;

            font-weight: 600;
        }


        .address {

            line-height: 1.6;
        }


        .payment {

            display: flex;

            align-items: center;

            gap: 8px;
        }


        .amount {

            color: white;

            font-size: 19px;

            font-weight: 800;
        }


        /* ERROR */

        .error {

            text-align: center;

            padding: 70px 20px;

            color: #ff8c9c;
        }


        /* MOBILE */

        @media (max-width: 700px) {

            .nav-links {
                display: none;
            }

            .page {
                width: 92%;
                margin-top: 35px;
            }

            .order-top {
                align-items: flex-start;

                gap: 15px;

                flex-direction: column;
            }

            .order-details {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<nav>

    <div class="logo">
        Libra<span>.</span>
    </div>


    <div class="nav-links">

        <a href="/index.html">
            Home
        </a>

        <a href="/index.html#books">
            Books
        </a>

        <a href="/index.html#categories">
            Categories
        </a>

        <a href="/index.html#about">
            About
        </a>

    </div>


    <a href="/cart.html"
       class="cart-nav">

        🛒 Cart

    </a>

</nav>



<main class="page">


    <div>

        <div class="eyebrow">
            YOUR ACCOUNT
        </div>

        <h1>
            My Orders
        </h1>

        <p class="subtitle">
            Track your orders and view your purchase history.
        </p>

    </div>



    <div id="loading"
         class="loading">

        Loading your orders...

    </div>



    <div id="empty"
         class="empty"
         style="display:none;">

        <div class="empty-icon">
            📦
        </div>

        <h2>
            No orders yet
        </h2>

        <p>
            You haven't placed any orders yet.
        </p>

        <a href="/index.html#books"
           class="browse-btn">

            Browse Books

        </a>

    </div>



    <div id="orders"
         class="orders"
         style="display:none;">

    </div>



    <div id="error"
         class="error"
         style="display:none;">

        Could not load your orders.

    </div>


</main>



<script>


    async function loadOrders() {

        const loading =
            document.getElementById("loading");

        const ordersContainer =
            document.getElementById("orders");

        const empty =
            document.getElementById("empty");

        const error =
            document.getElementById("error");


        const loggedInUser =
            JSON.parse(
                localStorage.getItem("loggedInUser")
            );


        if (!loggedInUser) {

            loading.style.display = "none";

            error.style.display = "block";

            error.textContent =
                "Please login to view your orders.";

            return;

        }


        try {

            /*
             * TEMPORARY:
             * We will connect this to the
             * user-specific backend endpoint
             * in the next step.
             */

            const response =
                await fetch(`/orders/user/${loggedInUser.id}`);

            if (!response.ok) {

                throw new Error(
                    "Could not load orders"
                );

            }


            const orders =
                await response.json();


            loading.style.display = "none";


            if (!orders || orders.length === 0) {

                empty.style.display = "block";

                return;

            }


            ordersContainer.style.display =
                "flex";


            ordersContainer.innerHTML = "";


            orders.forEach(order => {

                const card =
                    document.createElement("div");

                card.className =
                    "order-card";


                const orderDate =
                    order.orderDate
                        ? new Date(order.orderDate)
                            .toLocaleDateString(
                                "en-IN",
                                {
                                    day: "numeric",
                                    month: "short",
                                    year: "numeric"
                                }
                            )
                        : "N/A";


                const address =
                    `${order.house}, ${order.area}, ` +
                    `${order.city}, ${order.state} - ` +
                    `${order.pinCode}`;


                card.innerHTML = `

                <div class="order-top">

                    <div>

                        <div class="order-number">

                            Order #${order.id}

                        </div>

                        <div class="order-date">

                            ${orderDate}

                        </div>

                    </div>


                    <div class="status">

                        ${order.status || "PLACED"}

                    </div>

                </div>


                <div class="order-details">


                    <div>

                        <div class="detail-label">

                            Delivery Address

                        </div>

                        <div class="detail-value address">

                            ${order.customerName}<br>

                            ${address}<br>

                            📱 ${order.mobileNumber}

                        </div>

                    </div>


                    <div>

                        <div class="detail-label">

                            Payment

                        </div>

                        <div class="detail-value payment">

                            💳
                            ${order.paymentMethod}

                        </div>

                    </div>


                    <div>

                        <div class="detail-label">

                            Total Amount

                        </div>

                        <div class="amount">

                            ₹${Number(
                    order.totalAmount
                ).toFixed(0)}

                        </div>

                    </div>


                </div>

            `;


                ordersContainer.appendChild(card);

            });


        } catch (err) {

            console.error(err);

            loading.style.display =
                "none";

            error.style.display =
                "block";

        }

    }


    loadOrders();

</script>


</body>

</html>
